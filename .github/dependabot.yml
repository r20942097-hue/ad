version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: npm
    directories:
      - "/verification/ghostery"
      - "/verification/aglint"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
