version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directories:
      - "/verification/ghostery"
      - "/verification/aglint"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
