name: Filter list checks

on:
  push:
    paths:
      - '*.txt'
      - 'v2/**'
      - 'scripts/**'
      - 'tests/**'
      - 'filter-profiles.json'
      - 'verification/**'
      - '.github/workflows/japanese-text-softener.yml'
  # PR では全変更で実行する（main の Ruleset 必須チェックのため、パス絞り込みなし）
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Fail if ZIP/7z archives are tracked
        run: |
          if git ls-files | grep -iE '\.(zip|7z)$'; then
            echo "::error::ZIP/7z archives must not be committed (see AGENTS.md)"
            exit 1
          fi
      - name: Secret scan of the current tree (gitleaks v8.30.1, sha256-verified, archives 3 levels deep)
        # .gitleaks.toml = default rules + name-based rules; scans only the checked-out tree.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks dir --redact --no-banner --exit-code 1 --max-archive-depth 3 -c .gitleaks.toml .
      - name: Run filter regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Guard agent state against stale live SHAs and policy versions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          root = pathlib.Path(".")
          state = json.loads((root / "ai/PROJECT_STATE.json").read_text(encoding="utf-8"))
          heads = state.get("heads", {})
          assert set(heads) == {"note"}, "live HEAD must come from Git, not PROJECT_STATE"
          handoff = (root / "ai/HANDOFF.md").read_text(encoding="utf-8")
          current = handoff.split("## Current state\n", 1)[1].split("\n## ", 1)[0]
          assert not re.search(r"\b[0-9a-f]{40}\b", current, re.I), "HANDOFF has a stale live SHA"
          policy = (root / "AGENTS.md").read_text(encoding="utf-8")
          names = re.findall(
              r"^## (Operating policy v(\d+) \((\d{4}-\d{2}-\d{2})\))",
              policy, re.M,
          )
          assert names, "dated Operating policy heading is missing"
          active = max(names, key=lambda item: (item[2], int(item[1])))[0]
          assert state["policy"]["name"] == active, "policy authority drift"
          assert "自動同期はありません" not in policy, "stale sync instruction"
          assert "refresh-pinned-s.yml" in policy, "missing sync automation reference"
          loop = (root / "ai/AUTONOMOUS_LOOP.md").read_text(encoding="utf-8")
          for name, content in (("ai/HANDOFF.md", handoff),
                                ("ai/AUTONOMOUS_LOOP.md", loop)):
              assert active in content, f"{name}: stale active policy reference"
          fixed_language = re.compile(
              r"(?im)^[ \t]*(?:[-*][ \t]+)?(?:"
              r"(?:always[ \t]+|must[ \t]+)?report(?:ing)?[ \t]+"
              r"(?:(?:to[ \t]+the[ \t]+owner[ \t]+)?in[ \t]+Japanese)\b"
              r"|(?:報告|回答|返信|出力)(?:は|を)[ \t]*日本語(?:で|に)[ \t]*"
              r"(?:する|行う|統一|固定|必須|[。.!]|$)"
              r"|日本語で(?:必ず|常に)?[ \t]*(?:報告|回答|返信)"
              r"(?:する|してください|しなさい|を行う|$)"
              r")"
          )
          blanket_ban = re.compile(
              r"(?im)^[ \t]*(?:[-*][ \t]+)?(?:"
              r"No RPLAY recording/download features"
              r"|RPLAY.{0,24}(?:録画|保存).{0,16}(?:禁止|行わない|実装しない|不可)"
              r")(?=[ \t。.!、,]|$)"
          )
          # Behavioral checks for the regression guard, without injecting
          # forbidden rules into the actual instruction files.
          for sample in ("- 報告は日本語で行う", "- 日本語で報告すること",
                         "- Report to the owner in Japanese"):
              assert fixed_language.search(sample), "fixed-language guard broken"
          assert blanket_ban.search("- RPLAYの録画・保存機能は禁止"), "RPLAY ban guard broken"
          assert not fixed_language.search("- 日本語の文字を検査する"), "spurious language match"
          for name, content in (("AGENTS.md", policy),
                                ("ai/AUTONOMOUS_LOOP.md", loop),
                                ("ai/HANDOFF.md", handoff)):
              assert not fixed_language.search(content), f"{name}: fixed report language"
              assert not blanket_ban.search(content), f"{name}: blanket RPLAY feature ban"
          print("PASS: agent source precedence, policy, bilingual guard, and sync instructions")
          PY
      - name: Protect published subscription paths and license headers
        run: python scripts/check_subscription_contract.py --json
      - name: Validate all filter lists
        run: python scripts/validate_lists.py
      - name: Check generated network lists
        run: python scripts/generate_lists.py --check
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Prepare pinned, hash-verified engine
        run: python scripts/prepare_engine.py --directory "$RUNNER_TEMP/filter-engine"
      - name: Install locked optional secondary engine
        run: npm ci --prefix verification/ghostery --ignore-scripts --no-audit --no-fund
      - name: Install locked AGLint (MIT, filter-list linter)
        run: npm ci --prefix verification/aglint --ignore-scripts --no-audit --no-fund
      - name: Lint filter lists with AGLint
        run: git ls-files -z '*.txt' | xargs -0 verification/aglint/node_modules/.bin/aglint --no-colors
      - name: Check with uBlock Origin and Ghostery engines
        run: node scripts/check_engine.mjs --engine-dir "$RUNNER_TEMP/filter-engine" --ghostery-entry verification/ghostery/node_modules/@ghostery/adblocker/dist/esm/index.js

  # Standalone, non-required check: preserves Ruleset-required test and engine
  # names while verifying the latest CPython security patch separately.
  python315-compat:
    name: Python 3.15.2 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Show interpreter version
        run: python --version
      - name: Run filter regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate all filter lists
        run: python scripts/validate_lists.py
      - name: Verify generated network lists
        run: python scripts/generate_lists.py --check
