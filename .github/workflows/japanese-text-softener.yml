name: Filter list checks

on:
  push:
    paths:
      - '*.txt'
      - 'v2/**'
      - 'scripts/**'
      - 'tests/**'
      - 'filter-profiles.json'
      - 'verification/**'
      - '.github/workflows/japanese-text-softener.yml'
  # PR では全変更で実行する（main の Ruleset 必須チェックのため、パス絞り込みなし）
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Fail if ZIP/7z archives are tracked
        run: |
          if git ls-files | grep -iE '\.(zip|7z)$'; then
            echo "::error::ZIP/7z archives must not be committed (see AGENTS.md)"
            exit 1
          fi
      - name: Secret scan of the current tree (gitleaks v8.30.1, sha256-verified, archives 3 levels deep)
        # .gitleaks.toml = default rules + name-based rules; scans only the checked-out tree.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks dir --redact --no-banner --exit-code 1 --max-archive-depth 3 -c .gitleaks.toml .
      - name: Run filter regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Protect published subscription paths and license headers
        run: python scripts/check_subscription_contract.py --json
      - name: Validate all filter lists
        run: python scripts/validate_lists.py
      - name: Check generated network lists
        run: python scripts/generate_lists.py --check
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Prepare pinned, hash-verified engine
        run: python scripts/prepare_engine.py --directory "$RUNNER_TEMP/filter-engine"
      - name: Install locked optional secondary engine
        run: npm ci --prefix verification/ghostery --ignore-scripts --no-audit --no-fund
      - name: Install locked AGLint (MIT, filter-list linter)
        run: npm ci --prefix verification/aglint --ignore-scripts --no-audit --no-fund
      - name: Lint filter lists with AGLint
        run: git ls-files -z '*.txt' | xargs -0 verification/aglint/node_modules/.bin/aglint --no-colors
      - name: Check with uBlock Origin and Ghostery engines
        run: node scripts/check_engine.mjs --engine-dir "$RUNNER_TEMP/filter-engine" --ghostery-entry verification/ghostery/node_modules/@ghostery/adblocker/dist/esm/index.js

  # Standalone, non-required check: preserves Ruleset-required test and engine
  # names while verifying the latest CPython security patch separately.
  python315-compat:
    name: Python 3.15.2 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Show interpreter version
        run: python --version
      - name: Run filter regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate all filter lists
        run: python scripts/validate_lists.py
      - name: Verify generated network lists
        run: python scripts/generate_lists.py --check
