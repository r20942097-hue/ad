name: AIタスク
description: AI エージェントが自律実行できる粒度のタスク
title: "[AI] "
body:
  - type: textarea
    id: goal
    attributes:
      label: 目的
      description: 何を達成したいか（短文で可。AI が要件と受け入れ条件に展開します）
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件（任意）
      description: 例）CI が通る／特定のテストが PASS／ドキュメントが更新される
  - type: textarea
    id: high_impact
    attributes:
      label: 高影響な操作・公開への影響（該当する場合のみ）
      description: 公開設定・本番変更・不可逆操作・費用・認証情報など、実際に影響する事項だけ記載。通常作業の承認条件をここで一律に決めない。
